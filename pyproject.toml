[project]
name = "egopred"
version = "0.1.0"
description = "Ego trajectory prediction from front-camera video with per-scenario analysis"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pillow>=10.3",
    "pyyaml>=6.0",
    "av>=12.0",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# frozen backbone for offline feature extraction (CPU wheels in the test image, CUDA on GPU hosts)
features = ["torch>=2.7", "torchvision>=0.22", "timm==1.0.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
